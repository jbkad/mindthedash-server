services:
  - type: web
    name: mindthedash-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    plan: starter
    envVars:
      - key: RAILDATA_API_KEY
        sync: false
      - key: RAILDATA_URL
        sync: false
